# Configuración del proyecto (actividad 1).
# Todo lo que puede cambiar (datos, variables, modelo, MLflow) vive aquí, no en el código.

datos:
  ruta: data/Customer-Churn-Records.csv   # relativa a la raíz del repositorio

variables:
  objetivo: Exited
  numericas: [CreditScore, Age, Tenure, Balance, NumOfProducts, HasCrCard, IsActiveMember,
              EstimatedSalary, Complain, Satisfaction Score, Point Earned]
  categoricas: [Geography, Gender, Card Type]
  # Columnas que se descartan antes de entrenar. Complain coincide con Exited en ~99,7 % de
  # las filas (fuga de datos), así que se excluye para obtener métricas realistas.
  excluir: [Complain]

division:
  test_size: 0.2
  random_state: 42          # también se registra como semilla en MLflow

modelo:
  tipo: logistic_regression   # logistic_regression | gradient_boosting
  parametros:                 # argumentos del estimador de sklearn
    C: 1.0
    max_iter: 1000
    class_weight: balanced    # la clase positiva es ~20 %: se compensa el desbalance

mlflow:
  tracking_uri: http://localhost:5000  # MLFLOW_TRACKING_URI, si existe, tiene prioridad
  experimento: churn-training-mlops
  nombre_run: churn-training

metricas:
  umbral: 0.5               # probabilidad a partir de la cual se predice churn (Exited = 1)
